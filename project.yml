name: OldMusic

options:
  bundleIdPrefix: com.iamgasgass
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  OldMusic:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OldMusic
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: OldMusic
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.oldmusic
        INFOPLIST_FILE: OldMusic/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: OldMusic/OldMusic-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_MODULES: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
    dependencies:
      - sdk: MediaPlayer.framework
      - sdk: AVKit.framework
      - sdk: QuartzCore.framework
    scheme:
      testTargets: []
